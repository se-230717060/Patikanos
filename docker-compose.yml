services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: patikanos
      POSTGRES_PASSWORD: patikanos
      POSTGRES_DB: patikanos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patikanos -d patikanos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
        DATABASE_URL: postgresql+psycopg2://patikanos:patikanos@db:5432/patikanos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: